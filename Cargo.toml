[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.75"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2.5.8", features = ["json"] }
tauri-plugin-websocket = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.32"
tokio-tungstenite = "0.29.0"
tokio = "1.51.0"
anyhow = "1"
