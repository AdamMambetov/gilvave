<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tauri + Sycamore App</title>
  <link data-trunk rel="scss" href="./src/components/main.scss" />
  <link data-trunk rel="copy-dir" href="public" />
  <script>
    if (!window.__TAURI_INTERNALS__) {
      let callbackId = 1;
      const callbacks = new Map();
      const eventListeners = new Map();

      window.__TAURI_INTERNALS__ = {
        transformCallback: function (callback, once) {
          const id = callbackId++;
          callbacks.set(id, (data) => {
            if (once) callbacks.delete(id);
            callback(data);
          });
          return id;
        },
        invoke: async function (cmd, args = {}) {
          if (cmd === 'plugin:event|listen') {
            const { event, handler } = args;
            if (!eventListeners.has(event)) eventListeners.set(event, new Set());
            eventListeners.get(event).add(handler);
            return handler;
          }
          if (cmd === 'plugin:event|unlisten') {
            const { event, eventId } = args;
            if (eventListeners.has(event)) eventListeners.get(event).delete(eventId);
            callbacks.delete(eventId);
            return;
          }
          if (cmd === 'plugin:event|emit') {
            const { event, payload } = args;
            const listeners = eventListeners.get(event);
            if (listeners) {
              for (const handlerId of listeners) {
                const cb = callbacks.get(handlerId);
                if (cb) cb({ event, id: handlerId, payload });
              }
            }
            return;
          }
          if (cmd.startsWith('window_')) {
            return null;
          }
          return null;
        }
      };
    }
  </script>
</head>

<body></body>

</html>
